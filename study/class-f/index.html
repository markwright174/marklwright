<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PE/Health | Study Workspace</title>
  <meta name="description" content="PE/Health recordings, summaries, and study notes.">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/study.css">
</head>
<body class="study-body study-gated" data-course="class-f">
  <main class="study-shell" id="courseTop">
    <a class="back-link" href="/study/">Back to study home</a>
    <header class="course-page-header">
      <h1 id="courseTitle">PE/Health</h1>
      <nav class="course-jump-nav" aria-label="Course sections">
        <a href="#recordings">Recordings</a>
        <a href="#drive-materials">Drive materials</a>
        <a href="#class-helper">Class helper</a>
      </nav>
    </header>
    <section class="study-section anchored-section" id="recordings">
      <div class="section-head">
        <div>
          <p class="eyebrow">Class materials</p>
          <h2>Recordings and notes</h2>
        </div>
        <a class="section-top-link" href="#courseTop">Back to top</a>
      </div>
      <div id="courseRecordings" class="saved-list single-column" aria-live="polite"></div>
    </section>
    <section class="study-section anchored-section" id="drive-materials">
      <div class="section-head">
        <div>
          <p class="eyebrow">Course files</p>
          <h2>Google Drive materials</h2>
        </div>
        <a class="section-top-link" href="#courseTop">Back to top</a>
      </div>
      <div id="courseDriveMaterials" class="drive-materials" aria-live="polite"></div>
    </section>
    <section class="study-section anchored-section" id="class-helper">
      <div class="section-head">
        <div>
          <p class="eyebrow">Study helper</p>
          <h2>Ask about this class</h2>
        </div>
        <a class="section-top-link" href="#courseTop">Back to top</a>
      </div>
      <div class="study-chat" id="studyChat"></div>
    </section>
  </main>
  <script src="/assets/study-gate.js"></script>
  <script src="/assets/study-course.js"></script>
</body>
</html>
