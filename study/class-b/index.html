<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class B | Study Workspace</title>
  <meta name="description" content="Class B recordings, summaries, and study notes.">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/study.css">
</head>
<body class="study-body" data-course="class-b">
  <main class="study-shell">
    <a class="back-link" href="/study/">Back to study home</a>
    <section class="study-hero course-hero">
      <div>
        <p class="eyebrow">Course page</p>
        <h1 id="courseTitle">Class B</h1>
        <p class="lede" id="courseCount">Recordings saved here</p>
      </div>
    </section>
    <section class="study-section">
      <div class="section-head">
        <div>
          <p class="eyebrow">Class materials</p>
          <h2>Recordings and notes</h2>
        </div>
      </div>
      <div id="courseRecordings" class="saved-list single-column" aria-live="polite"></div>
    </section>
    <section class="study-section">
      <div class="section-head">
        <div>
          <p class="eyebrow">Study helper</p>
          <h2>Ask about this class</h2>
        </div>
      </div>
      <div class="study-chat" id="studyChat"></div>
    </section>
  </main>
  <script src="/assets/study-course.js"></script>
</body>
</html>
